<!--
  Configuración centralizada del grupo "windows"
  Destino: /var/ossec/etc/shared/windows/agent.conf (manager)
  Los canales Security, System y Application ya se recogen por defecto.
-->
<agent_config>

  <!-- Sysmon -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- PowerShell -->
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Windows Defender -->
  <localfile>
    <location>Microsoft-Windows-Windows Defender/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- FIM en carpetas sensibles -->
  <syscheck>
    <directories realtime="yes" check_all="yes">C:\Users\Public</directories>
  </syscheck>

</agent_config>
