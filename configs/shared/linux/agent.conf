<!--
  Configuración centralizada del grupo "linux"
  Destino: /var/ossec/etc/shared/linux/agent.conf (manager)
  Validar: sudo /var/ossec/bin/verify-agent-conf
-->
<agent_config>

  <!-- Autenticación (Ubuntu con rsyslog) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <!-- journald: usar en lugar de auth.log si la distro no escribe ficheros de texto (evita duplicados) -->
  <!--
  <localfile>
    <log_format>journald</log_format>
    <location>journald</location>
  </localfile>
  -->

  <!-- Servidor web nginx -->
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/nginx/access.log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/nginx/error.log</location>
  </localfile>

  <!-- Aplicación propia (decoder y reglas personalizados) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/labapp.log</location>
  </localfile>

  <!-- CU-02 · FIM en tiempo real -->
  <syscheck>
    <directories realtime="yes" check_all="yes" report_changes="yes">/root</directories>
    <directories realtime="yes" check_all="yes">/etc/ssh</directories>
  </syscheck>

  <!-- CU-04 · Docker (requiere Docker y el módulo python "docker" en el agente) -->
  <wodle name="docker-listener">
    <disabled>no</disabled>
  </wodle>

</agent_config>
