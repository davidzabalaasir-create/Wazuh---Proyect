# Relay rsyslog para los logs del firewall (ADR-003)
# Destino: /etc/rsyslog.d/10-firewall-relay.conf en ubuntu-agent
# Recibe syslog UDP/514 SOLO desde el firewall y lo escribe en un fichero
# con formato syslog tradicional, que el agente Wazuh lee con <localfile>.
#
# Aplicar:
#   sudo mkdir -p /var/log/remote
#   sudo cp 10-firewall-relay.conf /etc/rsyslog.d/
#   sudo rsyslogd -N1          # validar sintaxis
#   sudo systemctl restart rsyslog
#   sudo ufw allow from 192.168.56.1 to any port 514 proto udp

module(load="imudp")

input(type="imudp" port="514" ruleset="remote-firewall")

ruleset(name="remote-firewall") {
  if ($fromhost-ip == "192.168.56.1") then {
    action(type="omfile"
           file="/var/log/remote/firewall.log"
           template="RSYSLOG_TraditionalFileFormat")
  }
  stop
}
